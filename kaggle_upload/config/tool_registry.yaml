# =============================================================================
# Urdu S2S Pipeline — Tool Registry
# =============================================================================
# Defines the function/tool schemas used by p4a/p4b for agent episode
# generation. Each tool has parameters that the agent must call correctly.
# Tool descriptions guide Gemini to produce structured tool-calling episodes.
# =============================================================================

tools:
  # ── Banking Tools ──────────────────────────────────────────────────────────
  banking_get_balance:
    description: "Retrieve the current balance of a customer's bank account"
    domain: banking
    parameters:
      - name: account_id
        type: string
        required: true
        description: "Customer account identifier"
      - name: account_type
        type: string
        required: false
        description: "Type of account: savings, current, or default"
        enum: ["savings", "current", "default"]
    returns:
      balance: float
      currency: string
      last_updated: string

  banking_transfer:
    description: "Transfer money from one account to another"
    domain: banking
    parameters:
      - name: from_account
        type: string
        required: true
        description: "Source account ID"
      - name: to_account
        type: string
        required: true
        description: "Destination account ID"
      - name: amount
        type: float
        required: true
        description: "Amount to transfer in PKR"
      - name: purpose
        type: string
        required: false
        description: "Purpose of transfer"
    returns:
      transaction_id: string
      status: string
      timestamp: string

  banking_block_card:
    description: "Block a lost or stolen debit/credit card"
    domain: banking
    parameters:
      - name: card_number
        type: string
        required: true
        description: "Last 4 digits of the card"
      - name: reason
        type: string
        required: true
        description: "Reason for blocking: lost, stolen, fraud"
        enum: ["lost", "stolen", "fraud"]
    returns:
      block_reference: string
      status: string

  banking_loan_info:
    description: "Get information about available loan products or check loan application status"
    domain: banking
    parameters:
      - name: loan_type
        type: string
        required: false
        description: "Type of loan"
        enum: ["personal", "home", "car", "business", "education"]
      - name: application_id
        type: string
        required: false
        description: "Existing application reference number"
    returns:
      loan_products: list
      interest_rate: float
      tenure_months: int

  banking_get_statement:
    description: "Generate and send bank statement for a date range"
    domain: banking
    parameters:
      - name: account_id
        type: string
        required: true
        description: "Account identifier"
      - name: from_date
        type: string
        required: true
        description: "Start date (YYYY-MM-DD)"
      - name: to_date
        type: string
        required: true
        description: "End date (YYYY-MM-DD)"
    returns:
      statement_url: string
      transaction_count: int

  banking_file_complaint:
    description: "Register a customer complaint"
    domain: banking
    parameters:
      - name: category
        type: string
        required: true
        description: "Complaint category"
        enum: ["unauthorized_transaction", "service_issue", "fee_dispute", "atm_issue", "other"]
      - name: description
        type: string
        required: true
        description: "Detailed complaint description"
    returns:
      complaint_id: string
      expected_resolution_days: int

  banking_exchange_rate:
    description: "Get current currency exchange rates"
    domain: banking
    parameters:
      - name: from_currency
        type: string
        required: true
        description: "Source currency code"
      - name: to_currency
        type: string
        required: true
        description: "Target currency code (default PKR)"
    returns:
      rate: float
      last_updated: string

  # ── Healthcare Tools ───────────────────────────────────────────────────────
  healthcare_book_appointment:
    description: "Book a doctor's appointment"
    domain: healthcare
    parameters:
      - name: doctor_name
        type: string
        required: false
        description: "Preferred doctor name"
      - name: specialization
        type: string
        required: false
        description: "Medical specialization"
        enum: ["general", "cardiology", "dermatology", "orthopedics", "pediatrics", "gynecology", "ent", "neurology"]
      - name: date
        type: string
        required: true
        description: "Preferred appointment date (YYYY-MM-DD)"
      - name: time_slot
        type: string
        required: false
        description: "Preferred time (morning/afternoon/evening)"
        enum: ["morning", "afternoon", "evening"]
    returns:
      appointment_id: string
      doctor_name: string
      date_time: string
      hospital_name: string

  healthcare_prescription_refill:
    description: "Refill an existing prescription"
    domain: healthcare
    parameters:
      - name: prescription_id
        type: string
        required: true
        description: "Existing prescription reference number"
      - name: pharmacy_id
        type: string
        required: false
        description: "Preferred pharmacy location"
    returns:
      refill_id: string
      ready_by: string
      pharmacy_address: string

  healthcare_get_results:
    description: "Retrieve lab test results"
    domain: healthcare
    parameters:
      - name: test_id
        type: string
        required: true
        description: "Test reference number"
      - name: patient_id
        type: string
        required: true
        description: "Patient identifier"
    returns:
      results: dict
      doctor_notes: string
      date: string

  healthcare_insurance_info:
    description: "Check insurance coverage and claim status"
    domain: healthcare
    parameters:
      - name: policy_number
        type: string
        required: true
        description: "Insurance policy number"
      - name: service_type
        type: string
        required: false
        description: "Type of medical service to check coverage for"
        enum: ["consultation", "surgery", "lab_test", "medication", "hospitalization"]
    returns:
      covered: bool
      copay_amount: float
      coverage_percentage: float

  healthcare_emergency:
    description: "Report a medical emergency and dispatch ambulance"
    domain: healthcare
    parameters:
      - name: location
        type: string
        required: true
        description: "Current location or address"
      - name: emergency_type
        type: string
        required: true
        description: "Type of emergency"
        enum: ["cardiac", "accident", "breathing", "bleeding", "other"]
      - name: patient_name
        type: string
        required: false
        description: "Patient name if known"
    returns:
      dispatch_id: string
      eta_minutes: int
      nearest_hospital: string

  healthcare_doctor_schedule:
    description: "Check a doctor's availability schedule"
    domain: healthcare
    parameters:
      - name: doctor_name
        type: string
        required: false
        description: "Doctor name"
      - name: specialization
        type: string
        required: false
        description: "Medical specialization filter"
    returns:
      available_slots: list
      doctor_name: string

  # ── Education Tools ────────────────────────────────────────────────────────
  education_course_info:
    description: "Get information about available courses and programs"
    domain: education
    parameters:
      - name: department
        type: string
        required: false
        description: "Academic department"
        enum: ["computer_science", "business", "engineering", "arts", "medicine", "law"]
      - name: level
        type: string
        required: false
        description: "Program level"
        enum: ["undergraduate", "graduate", "phd", "certificate", "diploma"]
    returns:
      courses: list
      department: string
      admission_open: bool

  education_enroll:
    description: "Enroll a student in a course or program"
    domain: education
    parameters:
      - name: student_id
        type: string
        required: true
        description: "Student identifier"
      - name: course_code
        type: string
        required: true
        description: "Course code to enroll in"
      - name: semester
        type: string
        required: true
        description: "Target semester (e.g., Fall-2026)"
    returns:
      enrollment_id: string
      status: string
      start_date: string

  education_fee_info:
    description: "Get fee structure and payment information"
    domain: education
    parameters:
      - name: program_code
        type: string
        required: true
        description: "Program identifier"
      - name: semester
        type: string
        required: false
        description: "Specific semester"
      - name: scholarship_info
        type: bool
        required: false
        description: "Include available scholarship information"
    returns:
      total_fee: float
      installment_plan: list
      scholarships: list

  education_get_results:
    description: "Retrieve exam results or academic transcript"
    domain: education
    parameters:
      - name: student_id
        type: string
        required: true
        description: "Student identifier"
      - name: semester
        type: string
        required: false
        description: "Specific semester results"
      - name: transcript_type
        type: string
        required: false
        description: "Type of document"
        enum: ["semester_results", "full_transcript", "provisional_certificate"]
    returns:
      gpa: float
      courses: list
      document_url: string

  education_library_info:
    description: "Access library resources and schedule"
    domain: education
    parameters:
      - name: resource_type
        type: string
        required: false
        description: "Type of library resource"
        enum: ["book", "journal", "digital", "study_room"]
      - name: search_query
        type: string
        required: false
        description: "Search term for library catalog"
    returns:
      availability: dict
      hours: dict
      resources: list

  # ── Restaurant Tools ───────────────────────────────────────────────────────
  restaurant_reserve_table:
    description: "Reserve a table at the restaurant"
    domain: restaurant
    parameters:
      - name: date
        type: string
        required: true
        description: "Reservation date (YYYY-MM-DD)"
      - name: time
        type: string
        required: true
        description: "Reservation time (HH:MM)"
      - name: party_size
        type: int
        required: true
        description: "Number of guests"
      - name: special_occasion
        type: string
        required: false
        description: "Special occasion note"
        enum: ["birthday", "anniversary", "business", "none"]
    returns:
      reservation_id: string
      table_number: string
      confirmation_time: string

  restaurant_get_menu:
    description: "Get the restaurant menu with categories and prices"
    domain: restaurant
    parameters:
      - name: category
        type: string
        required: false
        description: "Menu category filter"
        enum: ["all", "appetizers", "main_course", "desserts", "drinks", "specials", "vegetarian"]
      - name: dietary_filter
        type: string
        required: false
        description: "Dietary restriction filter"
        enum: ["none", "vegetarian", "halal", "gluten_free", "nut_free"]
    returns:
      items: list
      specials: list

  restaurant_place_order:
    description: "Place a food order for delivery or takeaway"
    domain: restaurant
    parameters:
      - name: items
        type: list
        required: true
        description: "List of menu item IDs with quantities"
      - name: order_type
        type: string
        required: true
        description: "Order fulfillment type"
        enum: ["delivery", "takeaway", "dine_in"]
      - name: delivery_address
        type: string
        required: false
        description: "Delivery address (required for delivery orders)"
      - name: payment_method
        type: string
        required: false
        description: "Payment method"
        enum: ["cash", "card", "jazzcash", "easypaisa"]
    returns:
      order_id: string
      estimated_time: int
      total_amount: float

  restaurant_order_status:
    description: "Check the current status of an existing order"
    domain: restaurant
    parameters:
      - name: order_id
        type: string
        required: true
        description: "Order identifier"
    returns:
      status: string
      estimated_delivery: string
      rider_name: string

  restaurant_file_feedback:
    description: "Submit feedback or complaint about dining experience"
    domain: restaurant
    parameters:
      - name: order_id
        type: string
        required: false
        description: "Related order ID"
      - name: rating
        type: int
        required: true
        description: "Rating from 1-5"
      - name: comment
        type: string
        required: true
        description: "Feedback text"
      - name: category
        type: string
        required: true
        description: "Feedback category"
        enum: ["food_quality", "service", "delivery", "ambiance", "other"]
    returns:
      feedback_id: string
      follow_up_required: bool

  restaurant_special_request:
    description: "Submit a special dietary or customization request"
    domain: restaurant
    parameters:
      - name: order_id
        type: string
        required: true
        description: "Related order ID"
      - name: request_type
        type: string
        required: true
        description: "Type of special request"
        enum: ["allergy", "spice_level", "customization", "portion_size"]
      - name: details
        type: string
        required: true
        description: "Detailed description of the request"
    returns:
      acknowledged: bool
      modified_items: list

  # ── Cross-Domain Tool ──────────────────────────────────────────────────────
  transfer_to_human:
    description: "Transfer the caller to a human agent"
    domain: cross_domain
    parameters:
      - name: reason
        type: string
        required: true
        description: "Reason for escalation"
      - name: priority
        type: string
        required: false
        description: "Escalation priority level"
        enum: ["low", "medium", "high", "urgent"]
    returns:
      queue_position: int
      estimated_wait_minutes: int
