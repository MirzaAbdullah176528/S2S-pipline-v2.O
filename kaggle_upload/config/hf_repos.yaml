repos:
  stage0_codec:
    repo_id: "MessAgentix/stage0-codec"
    token: PRIMARY
    description: "Raw WAV 24kHz/16-bit + metadata Parquet shards (~345 GB at 10Kh)"
    subdirs:
      - "audio/"
      - "metadata/"

  overflow:
    repo_id: "MessAgentix/overflow-stage0"
    token: TERTIARY
    description: "stage0 overflow when PRIMARY repo exceeds 250GB local counter (~50-100 GB)"
    subdirs:
      - "audio/"
      - "metadata/"

  stage1_ce:
    repo_id: "MessAgentix/stage1-ce"
    token: PRIMARY
    description: "Mimi codec tokens (.npy per segment) + intent labels Parquet (~140 GB)"
    subdirs:
      - "tokens/"
      - "labels/"

  stage2_moe:
    repo_id: "MessAgentix/stage2-moe"
    token: SECONDARY
    description: "Seed dialogues + augmented variants JSONL (~800 MB)"
    subdirs:
      - "seeds/"
      - "augmented/"

  stage3_agent:
    repo_id: "MessAgentix/stage3-agent"
    token: SECONDARY
    description: "Agent episode JSONL (~1.2 GB)"
    subdirs:
      - "episodes/"
      - "dummy_env/"
      - "tools/"

  stage45_e2e:
    repo_id: "MessAgentix/stage45-e2e"
    token: SECONDARY
    description: "Aligned WAV/text pairs + MMS-TTS checkpoint in checkpoints/ subfolder (~50 GB)"
    subdirs:
      - "audio/"
      - "aligned/"
      - "checkpoints/"

  # Per-domain repos for domain-sharded synthesis output
  domain_restaurant:
    repo_id: "MessAgentix/domain-restaurant"
    token: SECONDARY
    description: "Restaurant domain episodes and synthesis"

  domain_banking:
    repo_id: "MessAgentix/domain-banking"
    token: SECONDARY
    description: "Banking domain episodes and synthesis"

  domain_healthcare:
    repo_id: "MessAgentix/domain-healthcare"
    token: SECONDARY
    description: "Healthcare domain episodes and synthesis"

  domain_education:
    repo_id: "MessAgentix/domain-education"
    token: SECONDARY
    description: "Education domain episodes and synthesis"
